<!DOCTYPE html>
<html>
<head>
    <title>NUTECH Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <nav>
        <a href="index.html">Home</a> |
        <a href="form.html">Register</a>
        <link rel="stylesheet" href="style.css">
    </nav>
    <hr>
    <form action="thanks.html" method="get">
        Full Name:
        <input type="text" name="fullname"
        placeholder="Enter your full name" required>
        <br><br>
        Registration No:
        <input type="text" name="regno" required>
        <br><br>
        Email:
        <input type="email" name="email" required>
        <br><br>
        Phone:
        <input type="tel" name="phone"
        placeholder="03XXXXXXXXX">
        <br><br>
        Age:
        <input type="number" name="age" min="16" max="40">
        <br><br>
        Date of Birth:
        <input type="date" name="dob">
        <br><br>
        Gender:
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>
        Department:
        <select name="department">
            <option value="AI">AI</option>
            <option value="CS">CS</option>
            <option value="SE">SE</option>
            <option value="EE">EE</option>
        </select>
        <br><br>
        Interests:
        <input type="checkbox" name="interests" value="Web"> Web
        <input type="checkbox" name="interests" value="AI"> AI
        <input type="checkbox" name="interests" value="Games"> Games
        <br><br>
        Address:
        <br>
        <textarea name="address" rows="4" cols="30"></textarea>
        <br><br>
        <button type="submit">Register</button>
        <button type="reset">Clear</button>
    </form>
</body>
</html>
